[package]
name = "tml-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "TaskManagerLite"
path = "src/main.rs"

[features]
default = ["renderer-software"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-software = ["slint/renderer-software"]

[dependencies]
tml-core = { path = "../core" }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"
embed-manifest = "1.5"
winresource = "0.1"
